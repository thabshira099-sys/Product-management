<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
</head>
<body class="bg-gray-200 min-h-screen flex justify-center pt-4">
  <div class="flex flex-col gap-4 w-full max-w-md">
    <div class="flex items-center gap-9">
      <label for="productName" class="text-sm font-medium">Product:</label>
      <input type="text" id="productName" class="border-2 p-2 rounded w-full">

    </div>
    <div class="flex items-center gap-3">
      <label for="productDescription" class="text-sm font-medium">Description:</label>
      <input type="text" id="productDescription" placeholder="Optional" class="border-2 p-2 text-sm rounded w-full">
    </div>
    <div class="flex items-center gap-14">
      <label for="productPrice" class="text-sm font-medium">Price:</label>
      <input type="number" id="productPrice" class="border-2 p-2 rounded w-full">
    </div>
    <button id="btn" class="bg-blue-800 text-white p-2 w-1/2 ml-36 rounded">Add Product</button>
    <div id="taskList" class="grid grid-cols-3 gap-4 ">
    </div>
  </div>

  <script src="./src/main.js"></script>
</body>

</html>
